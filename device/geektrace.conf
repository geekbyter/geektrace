# geektrace device configuration. Blank lines and lines starting with # or ; are ignored.
package = com.geektrace.bench

# 0 means wait indefinitely, including across target restarts.
duration = 0
out = /data/local/tmp/geektrace/events.jsonl

# Empty values select automatic behavior.
session =
uid =
tracefs =
libssl =
libcrypto =

# Keep false to avoid recording forks of unrelated apps. Host cold-start mode enables it explicitly.
zygote_forks = false

# Capture up to 8 user PCs for TLS/crypto events and resolve them through /proc/PID/maps.
stack = false

# Maximum number of payload bytes copied out of the target per event.
# 255 keeps the current behaviour; 0 means metadata only and reads no target
# memory at all, which is the smallest footprint option.
payload_limit = 255

# Library probes are attached after the target is known to map the library.
# true attaches them at startup instead, which closes the small blind window
# at process start but keeps the probe on libraries the target never uses.
eager_uprobes = false

# When the library probes are installed:
#   on-sight : as soon as the target exists (default)
#   eager    : at broker start, widest coverage and widest footprint
#   lazy     : only after the target maps the library
prearm = on-sight

# Maximum number of library copies to probe per kind (1-4).
# 2 covers the Java (Conscrypt) and native (/system) crypto library; 1 means
# fewer patched code pages but a real chance of missing the crypto entirely.
lib_copies = 2

# Development only: use an external BPF object instead of the embedded object.
bpffile =
