[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "geektrace"
version = "0.1.0"
description = "Root-only Android observation with AI-readable JSONL traces"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
geektrace = "geektrace.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
geektrace = ["assets/device/*/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
